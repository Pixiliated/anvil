[package]
name = "anvil_mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "anvil-mcp"
path = "src/main.rs"

[dependencies]
anvil_ops = { path = "../anvil_ops" }
rmcp = { version = "3.6.0", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
serde_json = "1.0.154"
