[package]
name = "anvil-lang-mcp"
description = "Anvil's commands as MCP tools for AI agents: the `anvil-mcp` server."
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "anvil_mcp"

[[bin]]
name = "anvil-mcp"
path = "src/main.rs"

[dependencies]
anvil_ops = { package = "anvil-lang-ops", version = "0.38.0", path = "../anvil_ops" }
rmcp = { version = "3.6.0", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
serde_json = "1.0.154"
