[package]
name = "anvil-lang-codegen"
description = "The Anvil language's native backend: Cranelift code, an embedded C runtime and the platform linker."
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "anvil_codegen"

[dependencies]
anvil_front = { package = "anvil-lang-front", version = "0.38.0", path = "../anvil_front" }
cc = "1.10.0"
cranelift-codegen = "0.137.0"
cranelift-frontend = "0.137.0"
cranelift-module = "0.137.0"
cranelift-object = "0.137.0"
libloading = "0.8.9"

[build-dependencies]
cc = "1.10.0"
