[workspace]
resolver = "2"
members = [
    "crates/anvil_front",
    "crates/anvil_interp",
    "crates/anvil_codegen",
    "crates/anvil_record",
    "crates/anvil_ops",
    "crates/anvil_cli",
    "crates/anvil_mcp",
]

[workspace.package]
version = "0.39.0"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["programming-language", "compiler", "ai-agents", "cranelift", "interpreter"]
categories = ["compilers", "development-tools"]

[profile.dev.package."*"]
opt-level = 2
