[workspace]
resolver = "2"
members = [
    "crates/anvil_front",
    "crates/anvil_interp",
    "crates/anvil_codegen",
    "crates/anvil_record",
    "crates/anvil_ops",
    "crates/anvil_cli",
    "crates/anvil_mcp",
]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.dev.package."*"]
opt-level = 2
