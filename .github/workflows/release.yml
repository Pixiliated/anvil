# On a tag v*: test on every supported target, build release archives there, and attach them
# (with their SHA-256 files) to a GitHub release. Run by hand (workflow_dispatch) it builds and
# uploads the archives as artifacts without releasing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (both backends, every program)
        run: cargo test --workspace --locked
      - name: Fuzz the backends
        run: cargo run --release --locked -p anvil-lang -- fuzz --count 50
      - name: Package
        shell: bash
        run: bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Anvil $GITHUB_REF_NAME" --notes "Binaries for Windows, Linux and macOS. See README.md and docs/SPEC.md."
